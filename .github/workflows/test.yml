name: Test & Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 scripts/check_docs.py   # 문서·오케스트레이션 정합 (docs/setup/DOC_HEALTH.md)

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci   # 락파일 그대로 (재현 가능)
      - run: node -c src/server.js  # 문법 검사
      - run: node -c src/app.js  # 문법 검사
      - run: node -c src/db.js  # 문법 검사
      - run: node -c db/index.js  # 문법 검사
      - run: node -c src/lifecycle.js  # 문법 검사
      - run: npm test
      - run: bash ../scripts/smoke.sh   # 서비스 스모크 (기동·health·SQLite 쓰기)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci   # 락파일 그대로 (재현 가능)
      - run: node -c src/main.js  # 문법 검사
      - run: npm test  # node --test (레지스트리·displayConfig·데모 어댑터)
      - run: npm run build  # Vite 빌드 검증 (Electron 대상)
      - run: npm run build:demo  # 웹 데모 빌드 검증 (VITE_DEMO, ADR-0026)

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall .  # 문법 검사
      - run: pytest -m "not network"
